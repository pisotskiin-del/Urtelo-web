{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Вход</h1>
  {% if form.errors %}<p class="error">Неверное имя пользователя или пароль.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Пользователь<input name="username" autofocus required value="{{ form.username.value|default:'' }}"></label>
    <label>Пароль<input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary">Войти</button>
  </form>
</div>
{% endblock %}
